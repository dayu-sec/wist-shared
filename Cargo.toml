[package]
name = "wist-shared"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
path = "src/lib.rs"
